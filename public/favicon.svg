<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Glow Filters -->
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="favCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="favRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="favOrbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="favCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Dark Midnight Background Container -->
  <rect width="120" height="120" rx="28" fill="#070B14" />
  <rect width="118" height="118" x="1" y="1" rx="27" stroke="#1E293B" stroke-width="1.5" />

  <!-- Scaling IMGIVO Icon into Favicon -->
  <g transform="translate(10, 8) scale(0.5)">
    <!-- Cloud Background -->
    <path
      d="M60 118 C38 118 30 102 39 86 C44 77 55 70 66 73 C72 54 96 44 115 53 C124 57 130 66 133 75 C149 74 161 87 157 102 C154 114 142 119 129 119 Z"
      fill="url(#favCloudGrad)"
      stroke="url(#favRimGrad)"
      stroke-width="3"
      filter="url(#favGlow)"
    />

    <!-- Camera Body -->
    <g transform="translate(48, 56)">
      <path d="M34 6 L39 1 L65 1 L70 6 Z" fill="#0A1020" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
      <circle cx="80" cy="16" r="3" fill="#38bdf8" />
      <rect x="14" y="6" width="76" height="54" rx="14" fill="#070D1D" stroke="#38bdf8" stroke-width="2.5" />
      <rect x="16" y="8" width="72" height="50" rx="12" fill="#0A1020" />
      <circle cx="52" cy="33" r="22" fill="#030712" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="52" cy="33" r="18" fill="#0284c7" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="52" cy="33" r="10" fill="#020617" />
      <circle cx="48" cy="29" r="4" fill="#38bdf8" opacity="0.8" />
      <circle cx="55" cy="35" r="2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Floating Photo Card -->
    <g transform="translate(108, 62) rotate(14)">
      <rect x="0" y="0" width="38" height="38" rx="8" fill="#0A1020" stroke="#a855f7" stroke-width="2.5" filter="url(#favGlow)" />
      <rect x="3" y="3" width="32" height="32" rx="6" fill="url(#favCardGrad)" opacity="0.9" />
      <circle cx="24" cy="11" r="3.5" fill="#ffffff" opacity="0.9" />
      <path d="M6 29 L16 16 L22 23 L26 19 L32 29 Z" fill="#070D1D" opacity="0.85" />
    </g>

    <!-- Glowing Orbit Streak -->
    <g filter="url(#favGlow)">
      <path
        d="M38 100 C34 116 58 132 100 128 C136 125 158 108 160 92"
        fill="none"
        stroke="url(#favOrbitGrad)"
        stroke-width="5"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
