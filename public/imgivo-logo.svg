<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <!-- Ambient Neon Blur -->
    <filter id="logoNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logoSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="fullCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="fullCloudRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="fullLensReflect" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="fullOrbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="fullCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="textImgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="textIvgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="textOGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
  </defs>

  <!-- ICON SECTION (Left) -->
  <g transform="translate(10, -5) scale(0.85)">
    <!-- Ambient Cloud Aura -->
    <path
      d="M60 120 C35 120 25 102 36 84 C41 74 53 66 65 69 C72 49 98 38 118 48 C128 53 135 63 138 73 C155 72 169 86 165 103 C163 117 150 123 135 123 Z"
      fill="url(#fullCloudGrad)"
      opacity="0.35"
      filter="url(#logoNeonGlow)"
    />

    <!-- Cloud Outer Body -->
    <path
      d="M60 118 C38 118 30 102 39 86 C44 77 55 70 66 73 C72 54 96 44 115 53 C124 57 130 66 133 75 C149 74 161 87 157 102 C154 114 142 119 129 119 Z"
      fill="url(#fullCloudGrad)"
      stroke="url(#fullCloudRim)"
      stroke-width="3.5"
      filter="url(#logoSoftGlow)"
    />

    <!-- Camera Body -->
    <g transform="translate(48, 56)">
      <!-- Top Flash/Finder Bump -->
      <path d="M34 6 L39 1 L65 1 L70 6 Z" fill="#0A1020" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Flash Light Dot -->
      <circle cx="80" cy="16" r="3" fill="#38bdf8" filter="url(#logoSoftGlow)" />
      
      <!-- Main Camera Housing -->
      <rect x="14" y="6" width="76" height="54" rx="14" fill="#070D1D" stroke="#38bdf8" stroke-width="2.8" />
      <rect x="16" y="8" width="72" height="50" rx="12" fill="#0A1020" />

      <!-- Lens Outer Glowing Bezel -->
      <circle cx="52" cy="33" r="22" fill="#030712" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="52" cy="33" r="18" fill="url(#fullLensReflect)" stroke="#00f2fe" stroke-width="1.8" />
      
      <!-- Lens Inner Aperture & Reflections -->
      <circle cx="52" cy="33" r="10" fill="#020617" />
      <circle cx="48" cy="29" r="4" fill="#38bdf8" opacity="0.85" />
      <circle cx="55" cy="35" r="2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Floating Photo Card on Top-Right -->
    <g transform="translate(108, 62) rotate(14)">
      <rect x="0" y="0" width="38" height="38" rx="8" fill="#0A1020" stroke="#a855f7" stroke-width="2.5" filter="url(#logoSoftGlow)" />
      <rect x="3" y="3" width="32" height="32" rx="6" fill="url(#fullCardGrad)" opacity="0.9" />
      <!-- Sun in card -->
      <circle cx="24" cy="11" r="3.5" fill="#ffffff" opacity="0.9" />
      <!-- Mountain Silhouette -->
      <path d="M6 29 L16 16 L22 23 L26 19 L32 29 Z" fill="#070D1D" opacity="0.85" />
    </g>

    <!-- Orbiting Glowing Light Streak Ring -->
    <g filter="url(#logoNeonGlow)">
      <path
        d="M38 100 C34 116 58 132 100 128 C136 125 158 108 160 92"
        fill="none"
        stroke="url(#fullOrbitGrad)"
        stroke-width="5"
        stroke-linecap="round"
      />
    </g>

    <!-- Sparkle Stars -->
    <g fill="#38bdf8" filter="url(#logoSoftGlow)">
      <path d="M142 42 Q144 48 150 50 Q144 52 142 58 Q140 52 134 50 Q140 48 142 42 Z" />
      <path d="M48 48 Q49 53 54 54 Q49 55 48 60 Q47 55 42 54 Q47 53 48 48 Z" fill="#60a5fa" />
      <path d="M168 118 Q169 121 172 122 Q169 123 168 126 Q167 123 164 122 Q167 121 168 118 Z" fill="#c084fc" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION (Right) -->
  <g transform="translate(180, 25)">
    <!-- IMGIVO Text -->
    <text
      x="0"
      y="65"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="62"
      font-weight="900"
      letter-spacing="-1"
    >
      <tspan fill="url(#textImgGrad)" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">IMG</tspan><tspan fill="url(#textIvgGrad)" filter="url(#logoSoftGlow)">IV</tspan><tspan fill="url(#textOGrad)" filter="url(#logoSoftGlow)">O</tspan>
    </text>

    <!-- Slogan Row: SHARE • STORE • ENJOY -->
    <g transform="translate(4, 92)">
      <!-- Left Accent Line -->
      <line x1="0" y1="-5" x2="35" y2="-5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#logoSoftGlow)" />
      
      <!-- Slogan Text -->
      <text
        x="48"
        y="0"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12"
        font-weight="800"
        fill="#94A3B8"
        letter-spacing="4"
      >
        <tspan fill="#E2E8F0">SHARE</tspan>
        <tspan fill="#38BDF8" font-size="14"> • </tspan>
        <tspan fill="#E2E8F0">STORE</tspan>
        <tspan fill="#C084FC" font-size="14"> • </tspan>
        <tspan fill="#E2E8F0">ENJOY</tspan>
      </text>

      <!-- Right Accent Line -->
      <line x1="285" y1="-5" x2="320" y2="-5" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" filter="url(#logoSoftGlow)" />
    </g>
  </g>
</svg>
